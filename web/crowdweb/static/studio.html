<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/studio.css"><link rel="icon" href="/static/mark.svg">
<title>Crowd Price · studio</title>
</head>
<body class="studio-page tab-chat">
<header class="bar wide">
  <a class="brand" href="/"><svg width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><path d="M3 5h6v5h5v5" fill="none" stroke="#16201a" stroke-width="2.6"/><path d="M14 15h7" fill="none" stroke="#1d7a44" stroke-width="2.6"/></svg><span>Crowd Price</span><span class="where">Studio</span></a>
  <span class="env" id="env"></span>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Studio" hidden>
  <button type="button" role="tab" id="tab-chat" aria-selected="true" aria-controls="chat">Chat</button>
  <button type="button" role="tab" id="tab-drop" aria-selected="false" aria-controls="side"><span>Drop</span><span class="tabnote" id="tabnote"></span></button>
</nav>
<main class="studio" id="studio">
  <section class="chat" id="chat" aria-label="Chat with your assistant">
    <div class="chathead"><h2>Your assistant</h2><button type="button" class="linkbtn" id="reset" hidden>New conversation</button></div>
    <ol class="log" id="log" aria-live="polite"></ol>
    <div class="compose">
      <form class="composer" id="composer" autocomplete="off">
        <label class="sr" for="say">Message your assistant</label>
        <textarea id="say" rows="1" maxlength="2000" placeholder="Your next batch and its costs" autocomplete="off" spellcheck="true"></textarea>
        <button class="btn" id="send" type="submit">Send</button>
      </form>
      <p class="composefine" id="composefine">Never type your passphrase here. You approve charges in the panel.</p>
    </div>
  </section>
  <section class="side" id="side" aria-label="Your drop, live"></section>
</main>
<script src="/static/app.js"></script>
<script src="/static/panel.js"></script>
<script src="/static/studio.js"></script>
</body>
</html>
