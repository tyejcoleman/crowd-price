<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="/static/app.css"><link rel="icon" href="/static/mark.svg">
<title>Crowd Price</title>
</head>
<body>
<header class="bar">
  <a class="brand" href="/"><svg width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><path d="M3 5h6v5h5v5" fill="none" stroke="#16201a" stroke-width="2.6"/><path d="M14 15h7" fill="none" stroke="#1d7a44" stroke-width="2.6"/></svg><span>Crowd Price</span></a>
  <span class="env" id="env"></span>
</header>
<p class="wrap status" id="status">Loading the drop…</p>
<main class="wrap" id="page" hidden>
  <section class="hero">
    <div class="lead">
      <p class="by" id="by"></p>
      <h1 class="two"><span id="title"></span> <span class="turn" id="turn"></span></h1>
      <p class="what" id="what" hidden></p>
      <div class="pricebox">
        <div class="label" id="pricelabel"></div>
        <div class="pricerow"><div class="price" id="price" aria-live="polite"></div><span class="was gone" id="was" aria-hidden="true"></span></div>
        <p class="next" id="next"></p>
        <p class="saved" id="saved" hidden></p>
      </div>
      <div class="ladder-box"><div id="ladder"></div><p class="caption" id="caption"></p></div>
    </div>
    <aside class="side">
      <img class="photo" id="photo" alt="" hidden>
      <div class="card join" id="join" aria-live="polite"></div>
    </aside>
  </section>
  <footer class="foot" id="foot"></footer>
</main>
<div class="stickyjoin" id="sticky" hidden><button class="btn" id="stickybtn" type="button"></button></div>
<script src="/static/app.js"></script>
<script src="/static/drop.js"></script>
</body>
</html>
