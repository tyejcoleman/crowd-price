[project]
name = "closure-certifier"
version = "0.1.0"
description = "Crowd Price: a group price drop on PayPal holds, run by an AI assistant, approved by a person"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["mcp>=1.2,<2", "cryptography"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "web"]
testpaths = ["tests", "web/tests"]

[tool.pyright]
extraPaths = ["src", "web"]
