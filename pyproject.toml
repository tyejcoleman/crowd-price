[project]
name = "closure-certifier"
version = "0.1.0"
description = "Certified money answers over PayPal records (working title)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
