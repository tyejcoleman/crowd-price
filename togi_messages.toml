# Wording for Crowd's errors and plain-language outcomes. This file is in the polish tier: hone may
# improve the words, but every {placeholder} must stay, and `status` and the commands in `next`
# are part of the guard behaviour (the stone checks them). Numbers are never written here; they
# are filled in from the engine.
#
# status: "error" = the request was wrong (exit 1); "refused" = a guard said no (exit 2).

[errors.drop_not_found]
message = "There is no drop {drop} in this store."
next = "togi crowd drop list"
status = "error"

[errors.bad_title]
message = "A drop needs a title of 1 to 120 characters."
next = "togi crowd drop create --title \"Speckled mugs\" --minimum 30 --hours 48 --ladder 30:40,45:36,60:33"
status = "error"

[errors.bad_currency]
message = "{currency} is not a 3-letter currency code."
next = "togi crowd drop create --help"
status = "error"

[errors.bad_number]
message = "{reason}"
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30"
status = "error"

[errors.bad_price]
message = "That price is not allowed: {reason}."
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30"
status = "error"

[errors.bad_ladder]
message = "That ladder is not valid: {reason}."
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30"
status = "error"

[errors.ladder_required]
message = "Give the ladder as --ladder 30:40,45:36,60:33 (buyers:price pairs), or use --from-proposal with --unit-cost and --fixed-cost."
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30"
status = "error"

[errors.ladder_conflict]
message = "Use either --ladder or --from-proposal, not both."
next = "togi crowd drop create --help"
status = "error"

[errors.costs_incomplete]
message = "Costs come as a pair: give both --unit-cost and --fixed-cost, or neither."
next = "togi crowd drop create --help"
status = "error"

[errors.minimum_mismatch]
message = "The minimum is {minimum} but the ladder's first step starts at {first_step} buyers. They must be the same number."
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum {minimum}"
status = "error"

[errors.start_price_loses_money]
message = "A start price of ${start_price} loses money at the minimum; the lowest price that does not is ${floor}."
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30"
status = "refused"

[errors.ladder_loses_money]
message = "Step {step} of the ladder ({min_buyers} buyers at ${price}) would make ${profit}, a loss."
next = "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30"
status = "refused"

[errors.duration_missing]
message = "Say how long the drop runs: --hours 48, or --minutes 90."
next = "togi crowd drop create --help"
status = "error"

[errors.duration_invalid]
message = "The drop needs a positive length of time."
next = "togi crowd drop create --help"
status = "error"

[errors.duration_too_long]
message = "A drop can run at most {max_minutes} minutes (72 hours), because PayPal only promises a hold for 3 days; you asked for {minutes}."
next = "togi crowd drop create --help"
status = "refused"

[errors.not_draft]
message = "Drop {drop} is {state}, not a draft, so it cannot be published."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.bad_drop_id]
message = "A drop id is d_ followed by 2 to 16 lowercase letters or digits; {drop} is not."
next = "togi crowd drop create --help"
status = "error"

[errors.drop_exists]
message = "A drop with id {drop} already exists."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.drop_not_published]
message = "Drop {drop} is still a draft; buyers can join once it is published."
next = "togi crowd drop publish --drop {drop}"
status = "refused"

[errors.drop_closed]
message = "Drop {drop} is {state}; joining has stopped."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.drop_ended]
message = "Drop {drop} reached its end time ({ended_at}); joining and leaving have stopped."
next = "togi crowd drop close --drop {drop}"
status = "refused"

[errors.drop_not_live]
message = "Drop {drop} is {state}, not live."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.already_joined]
message = "{buyer} already holds a place in drop {drop}."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.bad_buyer]
message = "A buyer needs a name of 1 to 60 characters."
next = "togi crowd drop join --drop {drop} --buyer \"Ada Lovelace\""
status = "error"

[errors.bad_card]
message = "Card {card} is not a sandbox test card; use a number from 0 to 9."
next = "togi crowd drop join --help"
status = "error"

[errors.join_declined]
message = "{buyer}'s card was declined when placing the hold, so they are not in the drop."
next = "togi crowd drop join --drop {drop} --buyer {buyer} --card 1"
status = "error"

[errors.buyer_not_found]
message = "No buyer {buyer} in drop {drop}."
next = "togi crowd buyers list --drop {drop}"
status = "error"

[errors.no_active_hold]
message = "{buyer} has no active hold in drop {drop} (status: {status})."
next = "togi crowd buyers list --drop {drop}"
status = "refused"

[errors.drop_not_closed]
message = "Drop {drop} is {state}; it must be closed before it can be settled."
next = "togi crowd drop close --drop {drop}"
status = "refused"

[errors.drop_not_settled]
message = "Drop {drop} is {state}, not settled, so there is nothing to check yet."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.nothing_captured]
message = "Drop {drop} captured no money, so there is no balance change to tie out."
next = "togi crowd drop verify --drop {drop}"
status = "refused"

[errors.plan_changed]
message = "The drop would settle as {actual}, not as {expected}. PayPal was asked about every remaining hold just now and the plan that follows from what it shows is not the one that was approved. Nothing was captured or released on the old plan."
next = "A person approves the new plan: togi crowd drop settle --drop {drop} --expect {actual}"
status = "refused"

[errors.capture_exceeds_hold]
message = "Refused to capture more than the hold for {buyer}."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.void_conflict]
message = "{buyer}'s hold was already captured elsewhere, so it cannot be released. Stop and ask the maker."
next = "togi crowd drop verify --drop {drop}"
status = "refused"

[errors.settle_blocked]
message = "Settlement of {drop} is stopped. PayPal answered {issue} (http {http}, debug id {debug_id}) while the engine was {phase} for {buyer}, and that is not something to retry blindly: it may be about the PayPal account or the request, not about one buyer. Nothing more was captured or released, and nothing was guessed."
next = "{next}"
status = "refused"

[errors.charged_before_leave]
message = "{buyer} asked to leave drop {drop} in time, but settlement had already captured their hold (capture {capture_id}, {amount}), so the leave could not release it. The request is on record. {buyer} should not be charged: the capture has to be refunded."
next = "A person refunds capture {capture_id} in the PayPal sandbox; `togi crowd drop verify --drop {drop}` keeps reporting it until PayPal shows it refunded."
status = "refused"

[errors.leave_pending]
message = "PayPal would not release {buyer}'s hold just now ({issue}, http {http}). The leave is on record, so {buyer} is not charged: closing the drop retries the release and takes them out of the crowd."
next = "togi crowd drop leave --drop {drop} --buyer {buyer}   # to retry now, or close the drop"
status = "error"

[errors.hold_unreadable]
message = "Cannot go on with {drop}: PayPal will not say what {buyer}'s hold {auth_id} is (it answered {issue}, http {http}, debug id {debug_id}). That is about the PayPal account or the permission to read this hold, not something to retry blindly. Nothing was closed or changed."
next = "{next}"
status = "refused"

[errors.wrong_paypal]
message = "Drop {drop} belongs to a different PayPal ({recorded}) than the one this session is using ({current}), so its holds cannot be read, joined, closed, settled or verified from here. Nothing was written."
next = "Use the PayPal the drop was made with (CROWD_PAYPAL={recorded_mode}), or work in a different store (CROWD_DB)."
status = "refused"

[errors.drop_unbound]
message = "Drop {drop} does not record which PayPal app placed its holds (it was written before drops recorded the PayPal, or before they recorded which sandbox app), so it belongs to no PayPal yet and nothing was read or written. The PayPal in use now is {current}, and the engine will not guess that it is the one that placed the drop's holds."
next = "Look at the holds, then a person binds the drop to the right PayPal: togi crowd drop holds --drop {drop}"
status = "refused"

[errors.already_bound]
message = "Drop {drop} is already bound to a PayPal ({paypal}); it cannot be bound again."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.bind_mismatch]
message = "Not binding {drop}: the PayPal in use ({paypal}) does not know, or will not say what it is about, hold(s) {holds} that the drop placed, so it cannot be shown to be the PayPal the drop was made with. Nothing was written."
next = "Use the PayPal the drop was made with (CROWD_PAYPAL, the sandbox credentials), then: togi crowd drop holds --drop {drop}"
status = "refused"

[errors.bind_changed]
message = "Not binding {drop} as {expected}: the PayPal and holds now read give {actual}. Nothing was written."
next = "A person approves what is there now: togi crowd drop bind --drop {drop} --expect {actual}"
status = "refused"

[errors.buyer_excluded]
message = "{buyer} was taken out of drop {drop} by a person and cannot rejoin it."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.already_excluded]
message = "{buyer} is already excluded from drop {drop}."
next = "togi crowd drop plan --drop {drop}"
status = "refused"

[errors.cannot_exclude]
message = "Drop {drop} is {state}; a buyer can only be excluded while it is live, closed or settling."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.hold_not_open]
message = "{buyer}'s earlier hold is no longer open at PayPal (PayPal says {status}), so it was not counted. The old try has been closed."
next = "togi crowd drop join --drop {drop} --buyer {buyer}"
status = "error"

[errors.earlier_attempt_unresolved]
message = "{buyer} has an earlier try whose hold could not be released or looked at, so no new hold was placed this time (that could hold their money twice). It is on record, so asking again goes on."
next = "A person checks the buyer's earlier order and hold in the PayPal sandbox and voids the hold if there is one; `togi crowd drop verify --drop {drop}` keeps reporting it. Then try again."
status = "refused"

[errors.test_approval_outside_test_mode]
message = "Refusing to run {command}: this approval was made by a throwaway test approver (scope {scope}), and {why}. Real value is only ever moved, released or bound on an approval from the person's own approver."
next = "A person approves it with their own approver (no TOGI_APPROVER_HOME set): togi approve <id>"
status = "refused"

[errors.drop_busy]
message = "Drop {drop} is being changed by another process right now."
next = "togi crowd drop status --drop {drop}"
status = "refused"

[errors.paypal_unavailable]
message = "PayPal could not be reached. Nothing was lost: every call is safe to repeat."
next = "togi crowd drop status --drop {drop}"
status = "error"

[errors.paypal_error]
message = "PayPal refused the request ({issue})."
next = "togi crowd drop status --drop {drop}"
status = "error"

[errors.paypal_not_configured]
message = "PayPal sandbox is not set up here: {reason}"
next = "export CROWD_PAYPAL=fake   # or put sandbox credentials in .env"
status = "error"

[errors.not_test_env]
message = "Refusing to wipe the store: CROWD_ENV is not 'test'."
next = "export CROWD_ENV=test"
status = "refused"

[errors.stone_requires_fake]
message = "A stone run must use the fake PayPal; CROWD_PAYPAL is not 'fake'."
next = "export CROWD_ENV=test CROWD_PAYPAL=fake"
status = "refused"

[errors.test_tools_not_for_agents]
message = "`togi crowd {command}` is test tooling for a person setting up a test store; an agent session cannot use it. Money moves only through `drop settle`, and that waits for a person."
next = "togi crowd drop list"
status = "refused"

[errors.store_has_real_holds]
message = "Refusing: this store holds {count} PayPal hold(s) that did not come from the fake PayPal (first: drop {drop}, {mode}). Test commands never touch a store that may have real money on a card."
next = "togi crowd drop list"
status = "refused"

[errors.too_many]
message = "Simulate at most {max} buyers at a time; you asked for {count}."
next = "togi crowd sim join --drop {drop} --count {max}"
status = "error"

[errors.unknown]
message = "{reason}"
next = "togi crowd drop list"
status = "error"

# Plain-language outcomes for `drop explain`. Only engine numbers are filled in; keep every placeholder.
[explain]
draft = "{title} is a draft: not published yet, nobody can join. Once it is published it runs for {duration}. The ladder is {ladder}; every buyer will hold ${start_price}, the most they can pay."
live = "{title} is live with {buyers} joined and {time_left} left. The price is ${price} for everyone right now. {next_message}. Nobody is charged until the drop closes and the minimum of {minimum} is met."
live_minimum_met = "{title} is live with {buyers} joined, over the minimum of {minimum}, and {time_left} left. The price is ${price} for everyone right now. {next_message}. Everyone is charged the lowest price reached when it closes."
ended = "{title} has reached its end time with {buyers} joined and is waiting to be closed. The price for everyone would be ${price}."
closed_funded = "{title} is closed with {buyers} joined, enough for the minimum of {minimum}. When settled, every hold will be charged ${price}, and the rest of each ${start_price} hold is released."
closed_not_funded = "{title} is closed with {buyers} joined, short of the minimum of {minimum}. When settled, every hold will be released and nobody pays."
settling = "{title} is part way through settling. Run settle again to carry on; nothing is ever charged twice."
settling_blocked = "Settlement of {title} is stopped for a person. PayPal answered {blocked_issue} (debug id {blocked_debug_id}) while the engine was {blocked_phase}, which may be about the PayPal account rather than one buyer, so nothing more was captured or released. The maker must look into it with PayPal; once it is fixed, ask for a fresh plan and have it approved."
settling_blocked_failures = "Settlement of {title} is stopped for a person: {blocked_message}. Failed charges like that usually share one cause (the account, the request, the cards) rather than being unlucky buyers, so nothing more was captured or released. The maker must look into it with PayPal; once it is fixed, or the one bad buyer is voided at PayPal or excluded, ask for a fresh plan and have it approved."
settled_funded = "{title} was funded. {buyers_at_close} people were in when it closed, over the minimum of {minimum}, so the price landed at ${final_price} for everyone. {captured} holds were charged ${final_price} each, and the rest of each ${start_price} hold (${released_each}) was released. PayPal's fees were ${fees}, so ${net} reaches the maker. Nobody paid more than ${final_price}."
settled_not_funded = "{title} did not reach its minimum: {buyers_at_close} of the {minimum} needed joined (short by {short_by}). Nobody was charged. All {voided} holds were released and there are no refunds to chase."
settled_not_funded_open = "{title} did not reach its minimum: {buyers_at_close} of the {minimum} needed joined (short by {short_by}). Nobody was charged. {voided} holds were released, but {unreleased} could not be released by PayPal and may still be held on a buyer's card."
unreleased_holds = " {unreleased} hold(s) could not be released by PayPal and may still be held on a buyer's card: `drop verify` names each one and what to do next."
failed_charges = " {failed} charge(s) failed at the end, so those buyers were not charged and the price stayed ${final_price} for everyone else."
failed_shortfall = " That leaves the drop {shortfall} buyer(s) short of its minimum until it is fixed."
