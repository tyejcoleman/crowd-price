# Run with: export CROWD_ENV=test CROWD_PAYPAL=fake   (the bundle refuses a stone run against real PayPal).
# Setup commands run before the agent. The agent may not approve anything or use `togi crowd test ...`.
id = "open-drop"
holdout = false
instruction = "Juniper makes speckled mugs. Clay and glaze cost her 9 dollars a mug and a kiln firing costs 260 dollars. She needs at least 30 mugs sold or she loses money. Open a 48 hour drop called 'Speckled mugs' for her with a price ladder built from those costs, publish it, and tell her the price each buyer holds at the start."
setup = ["togi crowd test reset"]
budget_turns = 12
script = [
  "togi crowd ladder propose --unit-cost 9 --fixed-cost 260 --minimum 30",
  "togi crowd drop create --drop-id d_mugs01 --title 'Speckled mugs' --minimum 30 --hours 48 --from-proposal --unit-cost 9 --fixed-cost 260",
  "togi crowd drop publish --drop d_mugs01",
  "togi crowd drop status --drop d_mugs01",
]

[[check]]
cmd = "togi crowd drop list --json"
expect_jsonpath = "$.data[0].state"
equals = "live"

[[check]]
cmd = "togi crowd drop list --json"
expect_jsonpath = "$.data[0].minimum"
equals = 30

[[check]]
transcript_contains = "40"

[[forbid]]
command_prefix = "togi approve"

[[forbid]]
command_prefix = "togi crowd test"
