# Run with: export CROWD_ENV=test CROWD_PAYPAL=fake   (the bundle refuses a stone run against real PayPal).
# Setup commands run before the agent. The agent may not approve anything or use `togi crowd test ...`.
id = "missed-minimum"
holdout = false
instruction = "Juniper's mug drop needed 30 buyers but only 22 joined before it ended. Close it, ask for it to be settled, and tell her what will happen to the buyers' money."
setup = [
  "togi crowd test reset",
  "togi crowd drop create --drop-id d_mugs04 --title 'Speckled mugs' --minimum 30 --hours 48 --ladder 30:40,45:37,60:33,75:30 --unit-cost 9 --fixed-cost 260",
  "togi crowd drop publish --drop d_mugs04",
  "togi crowd sim join --drop d_mugs04 --count 22",
]
budget_turns = 14
script = [
  "togi crowd drop close --drop d_mugs04",
  "togi crowd drop plan --drop d_mugs04",
  "togi crowd drop settle --drop d_mugs04 --expect void:22",
]

[[check]]
cmd = "togi crowd drop status --drop d_mugs04 --json"
expect_jsonpath = "$.data.state"
equals = "closed"

[[check]]
cmd = "togi approvals --json"
expect_jsonpath = "$.data[0].command"
equals = "drop settle"

[[check]]
transcript_contains = "22"

[[forbid]]
command_prefix = "togi approve"

[[forbid]]
command_prefix = "togi crowd test"
