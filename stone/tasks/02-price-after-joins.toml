# Run with: export CROWD_ENV=test CROWD_PAYPAL=fake   (the bundle refuses a stone run against real PayPal).
# Setup commands run before the agent. The agent may not approve anything or use `togi crowd test ...`.
id = "price-after-joins"
holdout = false
instruction = "Juniper's mug drop is live and buyers have been joining. Find the drop, then tell her the price every buyer pays right now and how many more buyers it takes for the price to drop again."
setup = [
  "togi crowd test reset",
  "togi crowd drop create --drop-id d_mugs02 --title 'Speckled mugs' --minimum 30 --hours 48 --ladder 30:40,45:37,60:33,75:30 --unit-cost 9 --fixed-cost 260",
  "togi crowd drop publish --drop d_mugs02",
  "togi crowd sim join --drop d_mugs02 --count 47",
]
budget_turns = 10
script = [
  "togi crowd drop list",
  "togi crowd drop status --drop d_mugs02",
]

[[check]]
cmd = "togi crowd drop status --drop d_mugs02 --json"
expect_jsonpath = "$.data.price"
equals = "37.00"

[[check]]
transcript_contains = "37"

[[check]]
transcript_contains = "13"

[[forbid]]
command_prefix = "togi approve"

[[forbid]]
command_prefix = "togi crowd test"
